<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>PTCHP system architecture</title>
<desc>Six-layer system diagram for the PTCHP platform: external data sources, ingestion, AI processing, application services, storage, and presentation.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  .ink { fill: #1A2332; }
  .soft { fill: #4A5568; }
  .mute { fill: #94A3B8; }
  .h { font-weight: 600; font-size: 14px; }
  .t { font-weight: 500; font-size: 14px; }
  .ts { font-weight: 400; font-size: 12px; }
  .lbl { font-size: 13px; font-weight: 600; fill: #1A2332; }

  /* Layer colors — matching the deck's Desert Mobility palette */
  .l-source rect { fill: #FAECE7; stroke: #D85A30; }
  .l-source text.title { fill: #4A1B0C; }
  .l-source text.sub { fill: #993C1D; }

  .l-ingest rect { fill: #EEEDFE; stroke: #534AB7; }
  .l-ingest text.title { fill: #26215C; }
  .l-ingest text.sub { fill: #3C3489; }

  .l-ai rect { fill: #E1F5EE; stroke: #1D9E75; }
  .l-ai text.title { fill: #04342C; }
  .l-ai text.sub { fill: #0F6E56; }
  .l-ai .inner { fill: #FFFFFF; stroke: #5DCAA5; stroke-width: 0.5; }

  .l-svc rect { fill: #E6F1FB; stroke: #378ADD; }
  .l-svc text.title { fill: #042C53; }
  .l-svc text.sub { fill: #185FA5; }

  .l-store rect { fill: #F1EFE8; stroke: #888780; }
  .l-store text.title { fill: #2C2C2A; }

  .l-pres rect { fill: #FAEEDA; stroke: #BA7517; }
  .l-pres text.title { fill: #412402; }

  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }

  rect { stroke-width: 0.5; }
</style>
</defs>

<rect width="680" height="720" fill="#FBF7F0"/>

<!-- ===== Layer 1: External sources ===== -->
<text class="lbl" x="40" y="32">External data sources</text>

<g class="l-source">
<rect x="40" y="48" width="148" height="56" rx="8"/>
<text class="title h" x="114" y="72" text-anchor="middle">RTA CRM</text>
<text class="sub ts" x="114" y="90" text-anchor="middle">Cases, SLA, satisfaction</text>

<rect x="204" y="48" width="148" height="56" rx="8"/>
<text class="title h" x="278" y="72" text-anchor="middle">Social platforms</text>
<text class="sub ts" x="278" y="90" text-anchor="middle">X · Meta · Reddit · RSS</text>

<rect x="368" y="48" width="148" height="56" rx="8"/>
<text class="title h" x="442" y="72" text-anchor="middle">Swiftly GTFS-rt</text>
<text class="sub ts" x="442" y="90" text-anchor="middle">Vehicles, trip updates</text>

<rect x="532" y="48" width="108" height="56" rx="8"/>
<text class="title h" x="586" y="72" text-anchor="middle">nol cards</text>
<text class="sub ts" x="586" y="90" text-anchor="middle">Tap events</text>
</g>

<line x1="114" y1="104" x2="114" y2="148" class="arr" marker-end="url(#arrow)"/>
<line x1="278" y1="104" x2="278" y2="148" class="arr" marker-end="url(#arrow)"/>
<line x1="442" y1="104" x2="442" y2="148" class="arr" marker-end="url(#arrow)"/>
<line x1="586" y1="104" x2="586" y2="148" class="arr" marker-end="url(#arrow)"/>

<!-- ===== Layer 2: Ingestion ===== -->
<text class="lbl" x="40" y="170">Ingestion · scheduled pollers</text>

<g class="l-ingest">
<rect x="40" y="186" width="148" height="56" rx="8"/>
<text class="title h" x="114" y="210" text-anchor="middle">CRM ETL</text>
<text class="sub ts" x="114" y="228" text-anchor="middle">Hourly batch · CDC</text>

<rect x="204" y="186" width="148" height="56" rx="8"/>
<text class="title h" x="278" y="210" text-anchor="middle">Social listener</text>
<text class="sub ts" x="278" y="228" text-anchor="middle">FastAPI · 60s poll</text>

<rect x="368" y="186" width="148" height="56" rx="8"/>
<text class="title h" x="442" y="210" text-anchor="middle">GTFS poller</text>
<text class="sub ts" x="442" y="228" text-anchor="middle">15s · async fetch</text>

<rect x="532" y="186" width="108" height="56" rx="8"/>
<text class="title h" x="586" y="210" text-anchor="middle">Tap stream</text>
<text class="sub ts" x="586" y="228" text-anchor="middle">Kafka topic</text>
</g>

<line x1="114" y1="242" x2="200" y2="294" class="arr" marker-end="url(#arrow)"/>
<line x1="278" y1="242" x2="290" y2="294" class="arr" marker-end="url(#arrow)"/>
<line x1="442" y1="242" x2="380" y2="294" class="arr" marker-end="url(#arrow)"/>
<line x1="586" y1="242" x2="470" y2="294" class="arr" marker-end="url(#arrow)"/>

<!-- ===== Layer 3: AI engine ===== -->
<text class="lbl" x="40" y="280">AI &amp; processing layer</text>

<g class="l-ai">
<rect x="40" y="296" width="600" height="120" rx="12"/>
<text class="title h" x="60" y="320">AI engine · Claude Haiku 4.5</text>
<text class="sub ts" x="60" y="338">Sentiment, classification, priority scoring</text>

<rect class="inner" x="60" y="352" width="170" height="48" rx="6"/>
<text class="t" x="145" y="374" text-anchor="middle" fill="#1A2332" font-weight="600">Normalizer</text>
<text class="ts" x="145" y="390" text-anchor="middle" fill="#4A5568">Unified schema</text>

<rect class="inner" x="246" y="352" width="170" height="48" rx="6"/>
<text class="t" x="331" y="374" text-anchor="middle" fill="#1A2332" font-weight="600">Sentiment + emotion</text>
<text class="ts" x="331" y="390" text-anchor="middle" fill="#4A5568">AR / EN scoring</text>

<rect class="inner" x="432" y="352" width="188" height="48" rx="6"/>
<text class="t" x="526" y="374" text-anchor="middle" fill="#1A2332" font-weight="600">CHI &amp; priority engine</text>
<text class="ts" x="526" y="390" text-anchor="middle" fill="#4A5568">Composite happiness index</text>
</g>

<line x1="200" y1="416" x2="180" y2="460" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="416" x2="340" y2="460" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="416" x2="500" y2="460" class="arr" marker-end="url(#arrow)"/>

<!-- ===== Layer 4: Application services ===== -->
<text class="lbl" x="40" y="452">Application services</text>

<g class="l-svc">
<rect x="40" y="468" width="195" height="68" rx="8"/>
<text class="title h" x="137" y="492" text-anchor="middle">REST API</text>
<text class="sub ts" x="137" y="510" text-anchor="middle">/cases · /mentions</text>
<text class="sub ts" x="137" y="525" text-anchor="middle">/gtfs · /chi</text>

<rect x="247" y="468" width="186" height="68" rx="8"/>
<text class="title h" x="340" y="492" text-anchor="middle">Streaming layer</text>
<text class="sub ts" x="340" y="510" text-anchor="middle">SSE for live spikes</text>
<text class="sub ts" x="340" y="525" text-anchor="middle">WebSocket fallback</text>

<rect x="445" y="468" width="195" height="68" rx="8"/>
<text class="title h" x="542" y="492" text-anchor="middle">Auth &amp; RBAC</text>
<text class="sub ts" x="542" y="510" text-anchor="middle">SSO · role tiers</text>
<text class="sub ts" x="542" y="525" text-anchor="middle">UAE PASS ready</text>
</g>

<line x1="137" y1="536" x2="137" y2="588" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="536" x2="340" y2="588" class="arr" marker-end="url(#arrow)"/>
<line x1="542" y1="536" x2="542" y2="588" class="arr" marker-end="url(#arrow)"/>

<!-- ===== Layer 5: Storage ===== -->
<text class="lbl" x="40" y="580">Storage</text>

<g class="l-store">
<rect x="40" y="596" width="148" height="44" rx="6"/>
<text class="title h" x="114" y="622" text-anchor="middle">PostgreSQL</text>

<rect x="204" y="596" width="148" height="44" rx="6"/>
<text class="title h" x="278" y="622" text-anchor="middle">Redis cache</text>

<rect x="368" y="596" width="148" height="44" rx="6"/>
<text class="title h" x="442" y="622" text-anchor="middle">S3 archive</text>

<rect x="532" y="596" width="108" height="44" rx="6"/>
<text class="title h" x="586" y="622" text-anchor="middle">Vector DB</text>
</g>

<!-- ===== Layer 6: Presentation ===== -->
<text class="lbl" x="40" y="668">Presentation</text>

<g class="l-pres">
<rect x="40" y="684" width="148" height="44" rx="6"/>
<text class="title h" x="114" y="710" text-anchor="middle">Web dashboard</text>

<rect x="204" y="684" width="148" height="44" rx="6"/>
<text class="title h" x="278" y="710" text-anchor="middle">Mobile app</text>

<rect x="368" y="684" width="148" height="44" rx="6"/>
<text class="title h" x="442" y="710" text-anchor="middle">Ops portal</text>

<rect x="532" y="684" width="108" height="44" rx="6"/>
<text class="title h" x="586" y="710" text-anchor="middle">Power BI</text>
</g>

</svg>
